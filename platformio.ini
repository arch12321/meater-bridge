[platformio]
; Change this to your board's environment name, or use -e flag: pio run -e esp32dev
default_envs = esp32-c3-devkitm-1

; =============================================================================
; Common settings shared by all ESP32 variants
; =============================================================================
[common]
platform = espressif32@7.1.2
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    knolleary/PubSubClient@2.8
build_flags =
    -D MB_FIRMWARE_VERSION=\"0.1.0\"
    -D CORE_DEBUG_LEVEL=3

; =============================================================================
; ESP32-C3 boards (RISC-V single-core, BLE 5.0, no classic Bluetooth)
; =============================================================================
[env:esp32-c3-devkitm-1]
extends = common
board = esp32-c3-devkitm-1

[env:esp32-c3-devkitc-02]
extends = common
board = esp32-c3-devkitc-02

[env:seeed_xiao_esp32c3]
extends = common
board = seeed_xiao_esp32c3

[env:lolin_c3_mini]
extends = common
board = lolin_c3_mini

; =============================================================================
; ESP32-S3 boards (Xtensa dual-core, BLE 5.0, no classic Bluetooth)
; =============================================================================
[env:esp32-s3-devkitc-1]
extends = common
board = esp32-s3-devkitc-1

[env:esp32-s3-devkitm-1]
extends = common
board = esp32-s3-devkitm-1

[env:lolin_s3]
extends = common
board = lolin_s3

[env:seeed_xiao_esp32s3]
extends = common
board = seeed_xiao_esp32s3

; =============================================================================
; Original ESP32 boards (Xtensa dual-core, BLE 4.2 + classic Bluetooth)
; =============================================================================
[env:esp32dev]
extends = common
board = esp32dev

[env:nodemcu-32s]
extends = common
board = nodemcu-32s

[env:lolin32]
extends = common
board = lolin32

[env:esp-wrover-kit]
extends = common
board = esp-wrover-kit

; =============================================================================
; ESP32-C6 boards (RISC-V single-core, BLE 5.0, Wi-Fi 6, Thread/Zigbee)
; =============================================================================
[env:esp32-c6-devkitc-1]
extends = common
board = esp32-c6-devkitc-1

[env:esp32-c6-devkitm-1]
extends = common
board = esp32-c6-devkitm-1
